[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "paneltone"
version = "0.2.0a3"
description = "Local manga colorization and style-redraw workbench"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115,<1",
  "huggingface-hub>=0.36,<2",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "nvidia-ml-py>=12.535,<13",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10.4,<13",
  "PyMuPDF>=1.24,<2",
  "python-multipart>=0.0.12,<1",
  "psutil>=5.9,<8",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
models = [
  "accelerate>=1.12,<2",
  "diffusers>=0.36,<0.40",
  "safetensors>=0.5,<1",
  "transformers>=4.57,<5",
]

[project.scripts]
paneltone = "manga_repaint.cli:main"
manga-repaint = "manga_repaint.cli:main"

[tool.hatch.build]
exclude = [
  "src/manga_repaint/web/frontend/node_modules",
  "src/manga_repaint/web/frontend/.vite",
  "src/manga_repaint/web/frontend/.generated",
  "src/manga_repaint/web/frontend/*.tsbuildinfo",
]

[tool.hatch.build.targets.wheel]
packages = ["src/manga_repaint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
